[package]
name = "remove-duplicate-files"
version = "0.1.0"
description = "Find and remove duplicate files with a React UI and native filesystem backend."
authors = ["Tobias Gassmann"]
edition = "2021"

[lib]
name = "remove_duplicate_files_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"

